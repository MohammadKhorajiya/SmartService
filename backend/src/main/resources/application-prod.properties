# ==========================================
# PAYMENT CONFIGURATION
# ==========================================
# Mock Payment Mode (for testing without real Razorpay keys)
payment.mode=mock
payment.fake.enabled=true
payment.fake.success-rate=100
payment.fake.delay-ms=1000

# Razorpay Configuration (disabled in mock mode)
razorpay.enabled=false
razorpay.key.id=rzp_mock_key_id
razorpay.key.secret=mock_key_secret

# Production Environment Validation
spring.profiles.active=prod
