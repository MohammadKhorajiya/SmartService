spring:
  application:
    name: smart-service-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
    redis:
      enabled: false
    mail:
      enabled: false

app:
  rate-limit:
    auth:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AUTH_RATE_LIMIT_RPM:20}
      refresh-requests-per-minute: ${AUTH_REFRESH_RATE_LIMIT_RPM:10}
  jwt:
    revoked-token-retention-days: ${REVOKED_TOKEN_RETENTION_DAYS:30}
